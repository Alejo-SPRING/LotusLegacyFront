<div class="container-fluid px-4 py-5 bg-4">
  <div class="my-5 py-5 container">
    <h1 class="display-5 fw-bold text-light py-4 border-bottom">
      <i class="fa-solid fa-users tc-1"></i> Miembros
    </h1>
    <div class="row mt-4">
      <div class="col-md-6">
        <p class="lead mb-4 text-light">
          Acá encontraras a todos los locos enfermos del clan, que farmean sin parar.
        </p>
      </div>
    </div>
  </div>
</div>
<div class="container-fluid px-4 py-5">
  <div class="row mt-3">
    <div class="col-12">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">
        @for (member of members; track $index) {
        <div class="col">
          <div class="card bg-4 text-light border-0" style="max-width: 340px">
            <div class="position-relative">
              <img [src]="member.img" class="card-img-top" style="max-height: 520px" alt="imagen" />
              <div
                class="badge position-absolute top-0 end-0 m-2"
                [ngClass]="{
                  'bg-danger': member.rank === 'Leader',
                  'bg-primary': member.rank === 'Elder',
                  'bg-success': member.rank === 'Elite',
                  'bg-secondary': member.rank === 'Member',
                  'bg-warning': member.rank === 'CoLeader'
                }"
              >
                <span><i class="fa-regular fa-star"></i> {{ member.rank }}</span>
              </div>
            </div>
            <div class="card-body d-flex justify-content-between">
              <p><span class="fw-bold">Nombre: </span>{{ member.name }}</p>
              <p><span class="fw-bold">Lvl: </span>{{ member.lvl }}</p>
              <p><span class="fw-bold">Id: </span>{{ member.id }}</p>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
